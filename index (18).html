<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubu &amp; Dudu: 2 years of us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  --bg:#ffeef3; --bg2:#ffd3e2; --ink:#4b2740; --muted:#8a6479; --card:#fffafc; --line:#f6cfdb;
  --accent:#e9437a; --hint:#b52a5c; --shadow:0 10px 30px rgba(233,67,122,.18);
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a1423; --bg2:#4a1f3d; --ink:#ffe8f1; --muted:#d7a9be; --card:#3a1d31; --line:#5a2f4c;
    --accent:#ff6f9a; --hint:#ffa3c0; --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#2a1423; --bg2:#4a1f3d; --ink:#ffe8f1; --muted:#d7a9be; --card:#3a1d31; --line:#5a2f4c;
  --accent:#ff6f9a; --hint:#ffa3c0; --shadow:0 10px 30px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;color:var(--ink);font-family:var(--font-body);-webkit-text-size-adjust:100%;
  background:radial-gradient(120% 60% at 15% 0%,var(--bg2) 0,transparent 60%),var(--bg);background-color:var(--bg)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}

.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.petal{position:absolute;top:-30px;opacity:.5;animation:petal linear infinite}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(46px,55vh) rotate(200deg)}100%{transform:translate(-24px,112vh) rotate(380deg)}}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.bar,.top,.nav{flex:0 0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.brand{font:800 20px/1 var(--font-display);letter-spacing:.2px}
.brand b{color:var(--accent);display:inline-block;animation:beatS 1.4s ease-in-out infinite}
@keyframes beatS{50%{transform:scale(1.25)}}
.snd{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:18px;line-height:1;color:var(--ink)}
.top{display:flex;justify-content:center;padding:10px 12px 4px}
.dot{width:9px;height:9px;border-radius:99px;border:0;background:var(--line);padding:0;margin:0 3px;position:relative;transition:width .3s,background .3s}
.dot::after{content:"";position:absolute;inset:-10px -4px}
.dot.on{width:24px;background:var(--accent)}

/* ---------- stage ---------- */
.stage{position:relative;margin:6px 12px;flex:1 1 0;min-height:0;border-radius:30px;overflow:hidden;
  border:3px solid rgba(255,255,255,.8);
  background:linear-gradient(180deg,var(--sa,#ffd3e1),var(--sb,#fff1f5));box-shadow:var(--shadow);
  container-type:size;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage.enter{animation:stageIn .6s both}
@keyframes stageIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.stage[data-theme="cover"]{--sa:#ffc2d8;--sb:#fff0f5;--floor:#ffb3cd}
.stage[data-theme="lunch"]{--sa:#ffe9a8;--sb:#ffe0e8;--floor:#f3cf9c}
.stage[data-theme="class"]{--sa:#cfe8ff;--sb:#fff0f6;--floor:#e6c8a6}
.stage[data-theme="branch"]{--sa:#c9f0d2;--sb:#e1ecff;--floor:#b7e2c0}
.stage[data-theme="glance"]{--sa:#ffd9c2;--sb:#ffcbdd;--floor:#efc2a2}
.stage[data-theme="insta"]{--sa:#dccfff;--sb:#ffdbef;--floor:#d5c3f5}
.stage[data-theme="propose"]{--sa:#ffc08a;--sb:#ff9ab9;--floor:#e87b9b}
.stage[data-theme="college"]{--sa:#bfe6ff;--sb:#ffe8cf;--floor:#a5dcaa}
.stage[data-theme="balloon"]{--sa:#d9ecff;--sb:#ffe4f1;--floor:#c9ebc8}
.stage[data-theme="hug"]{--sa:#ffd0e3;--sb:#fff0c6;--floor:#ffbfd6}
.stage[data-theme="night"]{--sa:#22103d;--sb:#7a2f68;--floor:#4a2159}

.floor{position:absolute;left:0;right:0;bottom:0;height:20%;background:var(--floor)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.35)}
.emo{position:absolute;pointer-events:none;line-height:1}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.35;transform:scale(.8)}}
.cloud{position:absolute;width:78px;height:26px;background:#fff;border-radius:99px;opacity:.8;left:-30%;animation:drift 50s linear infinite;pointer-events:none}
.cloud::before{content:"";position:absolute;left:14px;top:-14px;width:34px;height:34px;border-radius:50%;background:#fff}
.cloud::after{content:"";position:absolute;left:40px;top:-8px;width:26px;height:26px;border-radius:50%;background:#fff}
@keyframes drift{to{left:112%}}
.sp{position:absolute;top:-10%;z-index:1;pointer-events:none;line-height:1;opacity:.85;animation:spFall linear infinite}
@keyframes spFall{0%{top:-10%;transform:translateX(0) rotate(0)}50%{transform:translateX(30px) rotate(180deg)}100%{top:108%;transform:translateX(-14px) rotate(360deg)}}

/* actors */
.actor{--aw:min(30%,170px);position:absolute;bottom:13%;left:50%;width:var(--aw);z-index:2;cursor:pointer;
  transform:translateX(calc(-50% + var(--x,0%)));transition:transform .7s cubic-bezier(.3,1.35,.5,1);
  -webkit-tap-highlight-color:transparent}
.actor::after{content:"";position:absolute;left:14%;right:14%;bottom:-2%;height:7%;border-radius:50%;background:rgba(60,20,50,.16);z-index:-1}
.actor svg{display:block;width:100%;height:auto;overflow:visible;animation:bob 2.6s ease-in-out infinite}
.actor[data-kind="dudu"] svg{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-4px)}}
.enter-right{animation:inR 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes inR{from{translate:190% 0}to{translate:0 0}}
.tear{fill:#6ec6ff;transform-box:fill-box;transform-origin:center;animation:tear 1.1s ease-in infinite}
.tear.t2{animation-delay:-.55s}
@keyframes tear{0%{transform:translateY(-2px) scale(.6);opacity:0}20%{opacity:.95}100%{transform:translateY(24px) scale(1);opacity:0}}
.wail{transform-box:fill-box;transform-origin:center;animation:wail .45s ease-in-out infinite alternate}
@keyframes wail{to{transform:scaleY(.75)}}
.zzz{animation:zz 1.8s ease-in-out infinite}
@keyframes zz{0%,100%{opacity:.25}50%{opacity:1}}

.heart{position:absolute;z-index:5;pointer-events:none;font-size:20px;line-height:1;animation:floatUp 1.7s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0px),-90px) scale(1.15);opacity:0}}
.fly{position:absolute;z-index:5;font-size:28px;line-height:1;left:26%;top:46%;pointer-events:none;animation:fly 1.6s ease-in-out forwards}
@keyframes fly{0%{left:26%;top:46%;opacity:0;transform:scale(.6)}15%{opacity:1}50%{top:22%;transform:scale(1.25)}100%{left:70%;top:46%;opacity:0;transform:scale(.9)}}
.catch{position:absolute;z-index:6;top:104%;font-size:40px;line-height:1;padding:8px;cursor:pointer;animation:rise 4.2s linear forwards;-webkit-tap-highlight-color:transparent}
@keyframes rise{to{top:-20%}}

.bubble{position:absolute;z-index:4;background:#fff;color:#4b2740;padding:7px 11px;border-radius:14px;max-width:46%;
  font:700 13px/1.25 var(--font-body);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.bubble::after{content:"";position:absolute;bottom:-5px;left:20px;width:10px;height:10px;background:inherit;transform:rotate(45deg);border-radius:2px}
.bubble.late{animation:popin .45s 1.7s both}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* props */
.window{position:absolute;left:8%;top:9%;width:26%;height:30%;background:#cfeaff;border:5px solid #fff;border-radius:12px;overflow:hidden}
.window i{position:absolute;right:14%;top:14%;width:30%;aspect-ratio:1;border-radius:50%;background:#ffd95e}
.board{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:50%;min-height:22%;display:grid;place-items:center;
  background:#2f5d50;border:5px solid #c79a6a;border-radius:10px;color:#fff;font:800 clamp(18px,5.2vw,26px) var(--font-display)}
.desk{position:absolute;z-index:3;background:#c98f5e;border-radius:10px 10px 4px 4px;box-shadow:inset 0 5px 0 rgba(255,255,255,.28)}
.lunch{position:absolute;right:10%;top:-80%;font-size:26px;line-height:1}
.divider{position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed rgba(75,39,64,.25)}
.room{position:absolute;bottom:13%;width:43%;height:64%;border:3px dashed rgba(75,39,64,.3);border-radius:18px;background:rgba(255,255,255,.45)}
.room .actor{left:50%;bottom:6%;--x:0%}
.sign{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:#fff;color:#4b2740;border-radius:12px;padding:6px 14px;
  font:800 15px var(--font-display);box-shadow:0 4px 12px rgba(0,0,0,.1);white-space:nowrap}
.gapheart{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:20px;color:#e9437a;animation:beat 1.3s infinite}
.chip{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:#4b2740;
  font:700 12.5px var(--font-body);padding:5px 12px;border-radius:99px;white-space:nowrap}
.bench{position:absolute;z-index:3;left:6%;right:6%;bottom:7%;height:13%;background:#c98f5e;border-radius:12px;box-shadow:inset 0 5px 0 rgba(255,255,255,.28)}
@keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}

.phone{position:absolute;z-index:3;left:50%;top:6%;bottom:6%;transform:translateX(-50%);width:min(46%,190px);background:#fff;color:#4b2740;
  border:5px solid #2b2236;border-radius:22px;padding:12px 8px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.ph-head{font:800 13px var(--font-display);text-align:center}
.req{display:flex;align-items:center;gap:6px;background:#fff3f7;border-radius:12px;padding:6px}
.av{font-size:22px;line-height:1}
.who{flex:1;min-width:0}
.who b{display:block;font:800 12px var(--font-body)}
.who small{display:block;font:600 10.5px/1.2 var(--font-body);color:#8a6479}
.req button{border:0;background:#e9437a;color:#fff;font:800 11px var(--font-body);padding:6px 9px;border-radius:9px;animation:pulse 1.5s infinite}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:5px 9px;border-radius:12px;font:700 12px var(--font-body);animation:popin .35s both}
.msg.d{background:#ffe1ea;align-self:flex-start}
.msg.b{background:#e5dcff;align-self:flex-end}
@keyframes pulse{50%{transform:scale(1.06)}}

.sunbig{position:absolute;left:50%;bottom:18%;width:50%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fff6c2,#ffc27a 70%);opacity:.9}
.stage-cta{position:absolute;z-index:6;left:50%;top:8%;transform:translateX(-50%);border:0;background:#e9437a;color:#fff;
  font:800 16px var(--font-display);padding:11px 20px;border-radius:99px;box-shadow:0 8px 20px rgba(233,67,122,.45);animation:pulseX 1.5s infinite}
@keyframes pulseX{50%{transform:translateX(-50%) scale(1.07)}}

.bldg{position:absolute;left:50%;bottom:19%;width:56%;height:44%;transform:translateX(-50%);background:#f7d9b8;border-radius:10px 10px 0 0;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:12%;padding:14% 9% 22%}
.bldg::before{content:"";position:absolute;left:-5%;right:-5%;top:-17%;height:19%;background:#d98b73;clip-path:polygon(50% 0,100% 100%,0 100%)}
.bldg i{background:#bfe3ff;border-radius:4px}
.bldg i:nth-child(6),.bldg i:nth-child(7){visibility:hidden}
.bldg .door{position:absolute;left:50%;bottom:0;width:15%;height:34%;transform:translateX(-50%);background:#a8674a;border-radius:8px 8px 0 0}
.pair{position:absolute;bottom:13%;left:0;width:58%;display:flex;gap:2%;z-index:2;animation:walk 14s linear infinite}
.pair .actor{--aw:50%;position:relative;left:auto;bottom:auto;transform:none;cursor:default}
.pair .actor svg{animation-duration:.6s}
@keyframes walk{from{translate:-105% 0}to{translate:175% 0}}

.balloon{position:absolute;z-index:4;width:clamp(46px,14vw,64px);aspect-ratio:.82;border:0;padding:0;border-radius:50% 50% 48% 48%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8) 0 11%,transparent 13%),var(--c);color:rgba(255,255,255,.9);font-size:20px;line-height:1;
  transform:translateX(-50%);animation:floaty 3.4s ease-in-out infinite;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:44px;background:rgba(75,39,64,.35)}
.balloon.gone{animation:burst .3s ease-out forwards;pointer-events:none}
@keyframes floaty{50%{transform:translate(-50%,-9px)}}
@keyframes burst{to{transform:translateX(-50%) scale(1.8);opacity:0}}
.note{position:absolute;z-index:7;left:6%;right:6%;top:3%;background:#fff;color:#4b2740;border-radius:16px;padding:10px 14px;text-align:center;
  font:800 15px/1.3 var(--font-body);box-shadow:0 8px 20px rgba(0,0,0,.14);animation:popin .35s both}

.counter{position:absolute;z-index:4;left:50%;top:6%;transform:translateX(-50%);display:flex;gap:8px;flex-direction:column;align-items:center}
.pills{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.9);color:#4b2740;border-radius:16px;padding:7px 14px;text-align:center;font:800 22px/1 var(--font-display);min-width:68px}
.pill small{display:block;margin-top:3px;font:700 11px var(--font-body);color:#8a6479}
.total{background:#e9437a;color:#fff;border-radius:99px;padding:5px 14px;font:800 13px var(--font-body)}

.bigheart{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:clamp(54px,16vw,84px);line-height:1;animation:beat 1.3s ease-in-out infinite;cursor:pointer}
.choices{position:absolute;z-index:6;left:0;right:0;top:12%;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}
.btn-yes{border:0;background:#ff6b95;color:#fff;font:800 20px var(--font-display);padding:14px 30px;border-radius:99px;box-shadow:0 8px 24px rgba(255,107,149,.5);animation:pulse 1.4s infinite}
.btn-no{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.55);padding:10px 16px;border-radius:99px;font:700 14px var(--font-body);white-space:nowrap;z-index:6;touch-action:none}

/* ---------- caption card ---------- */
.card{flex:0 1 auto;max-height:44%;overflow:auto;-webkit-overflow-scrolling:touch;margin:6px 12px 0;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px 18px 14px;box-shadow:var(--shadow)}
.card.swap{animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card h2{margin:0 0 6px;font:800 clamp(22px,6vw,28px)/1.15 var(--font-display);color:var(--ink)}
.card.cover h2{font-size:clamp(28px,8.5vw,38px)}
.card p{margin:0;font:500 16px/1.55 var(--font-body);color:var(--ink);white-space:pre-line}
.card .hint{margin-top:10px;min-height:1.3em;font:700 13.5px/1.3 var(--font-body);color:var(--hint)}
.nav{display:flex;gap:10px;align-items:center;padding:12px 12px 14px}
.nav .back{flex:0 0 52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;line-height:1}
.nav .next{flex:1;height:52px;border:0;border-radius:99px;background:var(--accent);color:#fff;font:800 18px var(--font-display);box-shadow:var(--shadow)}
.nav .next:active{transform:scale(.98)}

.conf{position:fixed;top:-30px;z-index:50;pointer-events:none;line-height:1;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}

@supports (width:1cqh){
  .actor{--aw:min(30%,170px,27cqh)}
  .room .actor{--aw:min(62%,140px,30cqh)}
  .pair{width:min(58%,66cqh)}
  .pair .actor{--aw:50%}
}


.stage[data-theme="scratch"]{--sa:#ffd9ec;--sb:#fff3d6;--floor:#ffc2d8}

/* parallax: layers follow your finger / mouse a little */
.actor svg{translate:calc(var(--px,0)*-7px) calc(var(--py,0)*-3px);transition:translate .25s ease-out}
.window,.sunbig,.board,.bldg,.sign,.room,.bench,.desk{translate:calc(var(--px,0)*9px) calc(var(--py,0)*4px);transition:translate .25s ease-out}

/* chapter transition (heart ripple) */
.wipe{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;font-size:84px;line-height:1;
  background:linear-gradient(135deg,#ff8fb0,#ffc07a);clip-path:circle(0 at 50% 90%);visibility:hidden}
.wipe.in{visibility:visible;animation:wipeIn .45s ease-in forwards}
.wipe.out{visibility:visible;animation:wipeOut .45s ease-out forwards}
@keyframes wipeIn{from{clip-path:circle(0 at var(--cx,50%) var(--cy,90%))}to{clip-path:circle(150vmax at var(--cx,50%) var(--cy,90%))}}
@keyframes wipeOut{from{opacity:1;clip-path:circle(150vmax at var(--cx,50%) var(--cy,90%))}to{opacity:0;clip-path:circle(150vmax at var(--cx,50%) var(--cy,90%))}}
.fxcanvas{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}

/* tapping a character */
.hop{animation:hop .5s ease-out}
@keyframes hop{30%{translate:0 -24px}60%{translate:0 0}80%{translate:0 -6px}}
.bubble.tmp{animation:popin .3s both;max-width:40%}

/* scratch card */
.scratchwrap{position:absolute;z-index:3;left:9%;right:9%;top:5%;height:38%;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#4b2740;
  background:radial-gradient(circle at 50% 30%,#fff,#ffe1ec)}
.reveal small{font:800 13px var(--font-body);color:#b52a5c}
.reveal b{font:800 clamp(30px,10vw,46px)/1 var(--font-display);color:#e9437a}
.reveal i{font-style:normal;font-size:22px}
#sc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .6s}

/* hold-to-charge heart */
.holdwrap{position:absolute;z-index:3;left:50%;top:6%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.holdbtn{position:relative;width:120px;width:min(34cqh,140px);aspect-ratio:1;border-radius:50%;border:0;padding:0;
  background:conic-gradient(#ff4f81 calc(var(--p,0) * 1%),rgba(255,255,255,.65) 0);display:grid;place-items:center;
  touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;box-shadow:0 8px 22px rgba(233,67,122,.35);transition:transform .15s}
.holdbtn::before{content:"";position:absolute;inset:9%;border-radius:50%;background:#fff6fa}
.holdbtn span{position:relative;font:800 clamp(22px,7vw,30px) var(--font-display);color:#e9437a}
.holdbtn.pressed{transform:scale(.95)}
.holdcap{background:rgba(255,255,255,.9);color:#4b2740;font:800 13px var(--font-body);padding:5px 12px;border-radius:99px}

/* ---------- responsive ---------- */
@media (min-width:700px){
  .app{max-width:640px}
}
@media (max-width:360px){
  .brand{font-size:18px}
  .card{padding:12px 14px}
  .pill{min-width:56px;padding:6px 9px;font-size:19px}
  .dot{margin:0 2px}
  .dot.on{width:20px}
}
@media (max-height:760px){
  .card{padding:12px 16px 10px}
  .card h2{font-size:clamp(20px,5.6vw,25px);margin-bottom:4px}
  .card.cover h2{font-size:clamp(24px,7.4vw,32px)}
  .card p{font-size:15px;line-height:1.45}
  .card .hint{margin-top:6px;font-size:13px}
  .nav{padding:8px 12px 10px}
  .nav .back{flex-basis:46px;height:46px}
  .nav .next{height:46px;font-size:17px}
}
@media (max-height:640px){
  .bar{padding:6px 14px 0}
  .brand{font-size:17px}
  .snd{width:34px;height:34px;font-size:16px}
  .top{padding:6px 12px 2px}
  .stage{margin:4px 10px}

var fx = null;
function fxLoop(t){
  var ctx = fx.ctx, W = window.innerWidth, H = window.innerHeight;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  if (t < fx.end && t > fx.next) { fxBurst(); fx.next = t + 380 + Math.random()*320; }
  ctx.globalCompositeOperation = 'lighter';
  fx.parts = fx.parts.filter(function(p){ return p.life > 0; });
  fx.parts.forEach(function(p){
    p.vx *= .985; p.vy = p.vy*.985 + .045; p.x += p.vx; p.y += p.vy; p.life -= .012;
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
  if (t < fx.end || fx.parts.length) requestAnimationFrame(fxLoop);
  else { fx.on = false; ctx.clearRect(0, 0, W, H); }
}
function fxBurst(){
  var cx = window.innerWidth*(.15 + Math.random()*.7), cy = window.innerHeight*(.14 + Math.random()*.38);
  var cols = ['#ff4f81','#ff8fb0','#ffd166','#ffffff','#c9a7ff'];
  var col = cols[Math.floor(Math.random()*cols.length)];
  var heart = Math.random() < .6, n = heart ? 90 : 60;
  for (var i = 0; i < n; i++) {
    var a = i/n*6.283, vx, vy;
    if (heart) {
      var hx = 16*Math.pow(Math.sin(a), 3), hy = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a));
      var k = .2 + Math.random()*.02; vx = hx*k; vy = hy*k;
    } else { var sp = 1.5 + Math.random()*3.5; vx = Math.cos(a)*sp; vy = Math.sin(a)*sp; }
    fx.parts.push({ x:cx, y:cy, vx:vx, vy:vy, life:1, r:1.6 + Math.random()*1.4, col:col });
  }
  sfx('boom');
}
function fireworks(ms){
  if (reduce) return;
  if (!fx) {
    var c = document.createElement('canvas'); c.className = 'fxcanvas'; document.body.appendChild(c);
    fx = { c:c, ctx:c.getContext('2d'), parts:[], on:false, end:0, next:0 };
  }
  var dpr = window.devicePixelRatio || 1;
  fx.c.width = window.innerWidth*dpr; fx.c.height = window.innerHeight*dpr;
  fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.end = performance.now() + ms; fx.next = 0;
  if (!fx.on) { fx.on = true; requestAnimationFrame(fxLoop); }
}

/* ---------- heart-ripple transition between chapters ---------- */
var wipe = document.getElementById('wipe'), navBusy = false;
function transition(fn, src){
  if (navBusy) return;
  if (reduce) { fn(); return; }
  navBusy = true;
  var r = (src || nextBtn).getBoundingClientRect();
  wipe.style.setProperty('--cx', (r.left + r.width/2) + 'px');
  wipe.style.setProperty('--cy', (r.top + r.height/2) + 'px');
  wipe.className = 'wipe in';
  setTimeout(function(){
    fn();
    wipe.className = 'wipe out';
    setTimeout(function(){ wipe.className = 'wipe'; navBusy = false; }, 460);
  }, 470);
}

/* 7 scratch card */
{ theme:'scratch', notrail:true,
  title:'A date I\u2019ll never forget',
  text:'Scratch the card, Dudu. Do you remember this day?',
  hint:'Scratch with your finger \u2728',
  html:function(){
    return '<div class="floor"></div>'
      + '<div class="scratchwrap"><div class="reveal"><small>the day we became us</small><b>13.10.2024</b><i>\uD83D\uDC97</i></div><canvas id="sc"></canvas></div>'
      + actor('bubu','shy',C,'','--x:-62%','bubu')
      + actor('dudu','shy',C,'','--x:62%','dudu');
  },
  init:function(){
    stagePetals(6);
    var cv = q('#sc'), wrap = cv.parentNode, ctx = cv.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W = wrap.clientWidth, H = wrap.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr, dpr);
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#e9d5ff'); g.addColorStop(.5, '#ffd1e3'); g.addColorStop(1, '#ffe9a8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (var i = 0; i < 70; i++) { ctx.beginPath(); ctx.arc(Math.random()*W, Math.random()*H, 1 + Math.random()*2, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = '#8a4a74'; ctx.font = '800 20px "Baloo 2","Trebuchet MS",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Scratch here \u2728', W/2, H/2);
    var down = false, lx = 0, ly = 0, moves = 0, done = false;
    function pos(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    function scratch(x, y){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
      lx = x; ly = y;
    }
    function check(){
      if (done) return;
      var d = ctx.getImageData(0, 0, cv.width, cv.height).data, cleared = 0, total = 0, step = Math.max(12, Math.round(14*dpr));
      for (var y = 0; y < cv.height; y += step) for (var x = 0; x < cv.width; x += step) {
        total++; if (d[(y*cv.width + x)*4 + 3] < 100) cleared++;
      }
      if (total && cleared/total > .5) uncover();
    }
    function uncover(){
      done = true;
      cv.style.opacity = 0;
      later(function(){ if (cv.parentNode) cv.remove(); }, 700);
      sfx('win'); buzz([30, 40, 30]);
      setMood(q('#bubu'), 'love'); setMood(q('#dudu'), 'joy');
      pop(50, 30, 10); confetti(36); fireworks(2500);
      setHint('13 October 2024. I\u2019ll remember it forever \uD83D\uDC97');
    }
    cv.addEventListener('pointerdown', function(e){
      e.preventDefault(); down = true;
      if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
      var p = pos(e); lx = p[0]; ly = p[1]; scratch(p[0] + .1, p[1]);
    });
    cv.addEventListener('pointermove', function(e){
      if (!down || done) return;
      var p = pos(e); scratch(p[0], p[1]);
      if (++moves % 6 === 0) check();
    });
    ['pointerup','pointercancel'].forEach(function(ev){ cv.addEventListener(ev, function(){ down = false; check(); }); });
  }
},

      });
    });
  }
},

/* 10 hold to charge the love meter */
{ theme:'hug', notrail:true,
  title:'Charge the love meter',
  text:'Hold the heart, Dudu, and see how much love fits inside.',
  hint:'Press and hold the heart \uD83D\uDC97',
  html:function(){
    return '<div class="floor"></div>'
      + '<div class="holdwrap"><button class="holdbtn" id="hold" aria-label="Hold to charge the love meter"><span id="pct">0%</span></button><div class="holdcap" id="cap">hold me</div></div>'
      + actor('bubu','happy',C,'','--x:-148%;--aw:min(24%,110px)','bubu')
      + actor('dudu','happy',C,'','--x:148%;--aw:min(24%,110px)','dudu');
  },
  init:function(){
    stagePetals(6);
    var btn = q('#hold'), pct = q('#pct'), cap = q('#cap');
    var p = 0, holding = false, full = false, lastTick = 0;
    function setP(v){ p = Math.max(0, Math.min(100, v)); btn.style.setProperty('--p', p); pct.textContent = Math.round(p) + '%'; }
    function words(){
      if (p < 25) return 'keep holding\u2026';
      if (p < 50) return 'warming up \uD83D\uDD25';
      if (p < 75) return 'so much love!';
      return 'almost there!!';
    }
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault(); e.stopPropagation();
      if (full) return;
      holding = true; btn.classList.add('pressed');
      if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
      sfx('pop');
    });
    function release(){ holding = false; btn.classList.remove('pressed'); }
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ btn.addEventListener(ev, release); });
    every(function(){
      if (full) return;
      if (holding) {
        setP(p + 1.6); cap.textContent = words();
        if (Date.now() - lastTick > 450) { lastTick = Date.now(); var r = posOf(btn); pop(r.x, r.y + 12, 1); buzz(8); }
        if (p > 50) { var b = q('#bubu'), d = q('#dudu'); if (b && b.dataset.mood !== 'love') { setMood(b, 'love'); setMood(d, 'love'); } }
      } else if (p > 0) { setP(p - .9); if (p === 0) cap.textContent = 'hold me'; }
      if (p >= 100) complete();
    }, 40);
    function complete(){
      full = true; release();
      pct.textContent = '\u221E'; cap.textContent = 'Love overflow! \uD83D\uDC97';
      sfx('win'); buzz([40, 30, 40, 30, 80]);
      setMood(q('#bubu'), 'love'); setMood(q('#dudu'), 'joy');
      pop(50, 30, 16); confetti(50); fireworks(3500);
      setHint('It never stops at 100%. It only keeps going up \uD83D\uDC97');
    }
  }
},

/* 11 hug + counter */
{ theme:'hug',
  title:'Two years, and counting',
  text:'Every day since has had you in it, and I\u2019d choose you again.',
  hint:'Tap anywhere to bring us closer (0 / 5)',
  html:function(){
    return '<div class="counter"><div class="pills"><div class="pill"><span id="cy">0</span><small>years</small></div>'
      + '<div class="pill"><span id="cm">0</span><small>months</small></div>'
      + '<div class="pill"><span id="cd">0</span><small>days</small></div></div>'
      + '<div class="total" id="ct"></div></div>'
      + '<div class="floor"></div>'
      + actor('bubu','shy',C,'','--x:-90%','bubu')
      + actor('dudu','shy',C,'','--x:90%','dudu');
  },
  init:function(){
    stagePetals(8);
    var now = new Date();
    if (now < ANNIVERSARY_DAY) now = ANNIVERSARY_DAY;
    var r = diffYMD(START_DATE, now);
    q('#cy').textContent = r.y; q('#cm').textContent = r.m; q('#cd').textContent = r.d;
    var days = Math.max(Math.floor((now - START_DATE)/86400000), 0);
    q('#ct').textContent = days.toLocaleString() + ' days of us';
    var p = 0, b = q('#bubu'), d = q('#dudu');
    stage.addEventListener('click', function(){
      sfx('pop');
      if (p < 5) {
        p++;
        var g = 40 - p*9.2;
        b.style.setProperty('--x', (-(50 + g)) + '%');
        d.style.setProperty('--x', (50 + g) + '%');
        if (p < 5) { setHint('Tap anywhere to bring us closer (' + p + ' / 5)'); }
        else {
          setMood(b, 'love'); setMood(d, 'joy');
          setHint('Hug complete \uD83E\uDD17\uD83D\uDC97');
          later(function(){ sfx('win'); pop(50, 40, 14); }, 500);
        }
      } else { pop(50, 45, 4); }
    });
  }
},

/* 10 final question */
{ theme:'night', last:true,
  title:'One last question',
  text:'Dudu, will you stay my Dudu for one more year? And the next one? And the next?',
  hint:'Choose carefully \uD83D\uDE0C',
  html:function(){
    var stars = '';
    for (var i = 0; i < 14; i++) {
      stars += '<span class="emo tw" style="left:'+(Math.random()*92+2)+'%;top:'+(Math.random()*52+2)+'%;font-size:'+(10+Math.random()*10)+'px;animation-delay:-'+(Math.random()*2.5)+'s">\u2728</span>';
    }
    return stars + '<div class="floor"></div>'
      + '<div class="choices" id="choices"><button class="btn-yes" id="qyes">Yes \uD83D\uDC97</button><button class="btn-no" id="qno">No</button></div>'
      + actor('bubu','shy',C,'','--x:-72%','bubu')
      + actor('dudu','shy',C,'','--x:72%','dudu');
  },
  init:function(){
    var yes = q('#qyes'), no = q('#qno'), n = 0, last = 0;
    var words = ['No','Are you sure? \uD83E\uDD7A','Really?','Think again \uD83D\uDCAD','Just say yes \uD83D\uDC97','Pretty please \uD83E\uDD79','Not an option \uD83D\uDE1C'];
    function dodge(e){
      if (e) { if (e.cancelable) e.preventDefault(); e.stopPropagation(); }
      var t = Date.now(); if (t - last < 250) return; last = t;
      n++;
      sfx('pop');
      no.textContent = words[Math.min(n, words.length - 1)];
      if (no.parentNode !== stage) stage.appendChild(no);
      var sr = stage.getBoundingClientRect(), yr = yes.getBoundingClientRect();
      var nw = no.offsetWidth, nh = no.offsetHeight, x, y, tries = 0;
      do {
        x = 8 + Math.random()*Math.max(sr.width - nw - 16, 1);
        y = sr.height*0.22 + Math.random()*Math.max(sr.height*0.45 - nh, 1);
        tries++;
      } while (tries < 14 && x < yr.right - sr.left + 10 && x + nw > yr.left - sr.left - 10 && y < yr.bottom - sr.top + 10 && y + nh > yr.top - sr.top - 10);
      no.style.position = 'absolute'; no.style.left = x + 'px'; no.style.top = y + 'px';
    }
    no.addEventListener('pointerenter', dodge);
    no.addEventListener('pointerdown', dodge);
    no.addEventListener('touchstart', dodge, { passive:false });
    no.addEventListener('click', dodge);
    yes.addEventListener('click', function(e){ e.stopPropagation(); finale(); });
  }
}
];

/* ---------- engine ---------- */
var idx = 0, finalDone = false, introDone = false;
var typeT = null, fullText = '';

function typeInto(el, text){
  clearInterval(typeT);
  fullText = text || '';
  el.style.minHeight = '';
  if (reduce || !text) { el.textContent = text || ''; return; }
  el.textContent = text;
  el.style.minHeight = el.offsetHeight + 'px';   // reserve the space so the page doesn't jump
  el.textContent = '';
  var i = 0;
  typeT = setInterval(function(){
    i += 2;
    el.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(typeT);
  }, 18);
}
card.addEventListener('pointerdown', function(){
  if (fullText && textEl.textContent !== fullText) { clearInterval(typeT); textEl.textContent = fullText; }
});

function setCard(title, text, hint, cover){
  titleEl.textContent = title; hintEl.textContent = hint || '';
  card.classList.toggle('cover', !!cover);
  card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
  typeInto(textEl, text);
}
function renderDots(){
  dotsEl.innerHTML = scenes.map(function(s, i){
    return '<button class="dot'+(i === idx ? ' on' : '')+'" data-i="'+i+'" role="tab" aria-selected="'+(i === idx)+'" aria-label="Chapter '+(i+1)+'"></button>';
  }).join('');
}
function updateNav(){
  var lastIdx = scenes.length - 1;
  backBtn.hidden = idx === 0;
  if (idx === 0 && !introDone) { nextBtn.hidden = true; return; }
  if (idx === lastIdx && !finalDone) { nextBtn.hidden = true; return; }
  nextBtn.hidden = false;
  nextBtn.textContent = idx === lastIdx ? 'Watch our story again' : (scenes[idx].cta || 'Next');
}
function go(i){
  clearAll();
  // fresh stage node so listeners from the previous chapter never linger
  var fresh = stage.cloneNode(false);
  stage.parentNode.replaceChild(fresh, stage);
  stage = fresh;
  stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
  idx = Math.max(0, Math.min(i, scenes.length - 1));
  finalDone = false;
  var s = scenes[idx];
  stage.dataset.theme = s.theme;
  stage.innerHTML = s.html();
  setCard(s.title, s.text, s.hint, s.cover);
  renderDots(); updateNav();
  if (s.init) s.init();
  // tap a character and they giggle; tap anywhere else for a tiny heart
  stage.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('button')) return;
    var a = e.target.closest && e.target.closest('.actor');
    if (a) { react(a); return; }
    var r = stage.getBoundingClientRect();
    pop(((e.clientX - r.left)/r.width)*100, ((e.clientY - r.top)/r.height)*100 - 6, 1);
  });
  // layers drift a little with your finger or mouse, and dragging leaves sparkles
  var lastTrail = 0;
  stage.addEventListener('pointermove', function(e){
    var r = stage.getBoundingClientRect();
    stage.style.setProperty('--px', (((e.clientX - r.left)/r.width) - .5).toFixed(3));
    stage.style.setProperty('--py', (((e.clientY - r.top)/r.height) - .5).toFixed(3));
    if (!s.notrail && (e.buttons || e.pointerType === 'touch')) {
      var t = Date.now();
      if (t - lastTrail > 70) { lastTrail = t; spark(e); }
    }
  });
}
function finale(){
  finalDone = true;
  sfx('win');
  confetti();
  fireworks(8000);
  buzz([40, 30, 40, 30, 120]);
  var b = q('#bubu'), d = q('#dudu');
  if (b && d) {
    b.style.setProperty('--x', '-44%'); d.style.setProperty('--x', '44%');
    setMood(b, 'love'); setMood(d, 'joy');
  }
  var c = q('#choices'), no = q('#qno');
  if (c) c.remove();
  if (no) no.remove();
  var big = document.createElement('div'); big.className = 'bigheart'; big.textContent = '\uD83D\uDC96';
  stage.appendChild(big);
  pop(50, 40, 14);
  setCard('Happy 2nd anniversary, Dudu \uD83D\uDC97', FINAL_MESSAGE, '');
  updateNav();
}

nextBtn.addEventListener('click', function(){
  if (navBusy) return;
  sfx('next');
  transition(function(){
    if (idx === scenes.length - 1) { introDone = false; go(0); } else { go(idx + 1); }
  }, nextBtn);
});
backBtn.addEventListener('click', function(){
  if (navBusy) return;
  sfx('next');
  transition(function(){ go(idx - 1); }, backBtn);
});
dotsEl.addEventListener('click', function(e){
  var b = e.target.closest('.dot'); if (!b) return;
  transition(function(){ go(+b.dataset.i); }, b);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !nextBtn.hidden) nextBtn.click();
  if (e.key === 'ArrowLeft' && !backBtn.hidden) backBtn.click();
});
var sx = null, sy = null;
document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
document.addEventListener('touchend', function(e){
  if (sx === null) return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) < 80 || Math.abs(dy) > 60) return;
  if (dx < 0 && !nextBtn.hidden) nextBtn.click();
  if (dx > 0 && !backBtn.hidden) backBtn.click();
}, { passive:true });

go(0);
})();
</script>
